<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ecae6"/>
      <stop offset="1" stop-color="#d7eef7"/>
    </linearGradient>
    <linearGradient id="sobre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2a191"/>
      <stop offset="1" stop-color="#f7c6b9"/>
    </linearGradient>
  </defs>

  <!-- Cielo y sol -->
  <rect width="480" height="480" rx="24" fill="url(#cielo)"/>
  <circle cx="380" cy="95" r="42" fill="#fff4c9"/>

  <!-- Nubes -->
  <g fill="#ffffff">
    <ellipse cx="110" cy="90" rx="58" ry="24"/>
    <ellipse cx="150" cy="74" rx="38" ry="26"/>
    <ellipse cx="80" cy="78" rx="28" ry="20"/>
    <ellipse cx="300" cy="160" rx="46" ry="18"/>
    <ellipse cx="330" cy="148" rx="30" ry="20"/>
  </g>

  <!-- Colinas -->
  <path d="M0 330 C90 280 170 300 250 330 C330 360 400 300 480 315 L480 480 L0 480 Z" fill="#a7c9a0"/>
  <path d="M0 390 C110 350 200 370 290 395 C370 418 430 380 480 385 L480 480 L0 480 Z" fill="#8bb884"/>

  <!-- Casita -->
  <g transform="translate(360 290)">
    <rect x="0" y="22" width="56" height="40" fill="#fffaf0"/>
    <path d="M-8 26 L28 0 L64 26 Z" fill="#d9705b"/>
    <rect x="22" y="38" width="14" height="24" fill="#8a5a44"/>
    <rect x="6" y="32" width="11" height="11" fill="#8ecae6"/>
  </g>

  <!-- Árbol -->
  <rect x="62" y="300" width="10" height="34" fill="#8a5a44"/>
  <circle cx="67" cy="292" r="26" fill="#6fa36a"/>

  <!-- Sobre -->
  <g transform="translate(150 200)">
    <rect x="0" y="0" width="180" height="125" rx="14" fill="url(#sobre)"/>
    <path d="M8 12 L90 78 L172 12" fill="none" stroke="#2f3e46" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="176" cy="4" r="24" fill="#ffffff"/>
    <path d="M164 4 h24 M176 -8 v24" stroke="#d9705b" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Avión de papel y estela -->
  <path d="M70 250 C110 220 130 180 180 165" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="8 8"/>
  <g transform="translate(180 145) rotate(-25)">
    <path d="M0 20 L60 0 L22 30 Z" fill="#ffffff"/>
    <path d="M22 30 L60 0 L30 42 Z" fill="#dbe6ea"/>
  </g>

  <!-- Texto -->
  <text x="240" y="448" font-family="Fredoka, Trebuchet MS, Segoe UI, sans-serif" font-size="38" font-weight="600" fill="#2f3e46" text-anchor="middle">¡Escribinos!</text>
</svg>
